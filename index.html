<title>坦克大战 · TANK BATTLE</title>
<style>
:root{
  --bg:#101318;
  --bezel:#171E27;
  --edge:#26303C;
  --ink:#C9D2DA;
  --muted:#727F8B;
  --gold:#E8B93D;
  --gold-hi:#FFE9A8;
  --gold-dk:#7E5B10;
  --phosphor:#6FDC7A;
  --alert:#E0483C;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(1100px 700px at 50% 18%, #182029 0%, var(--bg) 55%, #0A0D11 100%);
  color:var(--ink);
  font-family:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,"Courier New",monospace;
  display:flex;flex-direction:column;align-items:center;
  padding:26px 14px 46px;
}
.logo{
  display:flex;align-items:baseline;gap:12px;margin-bottom:18px;
  user-select:none;
}
.logo .cn{font-size:20px;font-weight:700;color:var(--gold);letter-spacing:.35em;text-shadow:2px 2px 0 #4A3407;}
.logo .en{font-size:11px;color:var(--muted);letter-spacing:.3em;text-transform:uppercase;}
.arcade{display:flex;gap:18px;justify-content:center;align-items:flex-start;flex-wrap:wrap;}
.bezel{
  position:relative;
  background:linear-gradient(180deg,#1B232D 0%,var(--bezel) 100%);
  border:1px solid var(--edge);
  padding:14px;border-radius:10px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 24px 60px rgba(0,0,0,.55);
  width:min(92vw,560px);
}
.screen{position:relative;border-radius:3px;overflow:hidden;background:#000;}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;}
.scan{
  position:absolute;inset:0;pointer-events:none;border-radius:3px;
  background:
    radial-gradient(140% 110% at 50% 45%, rgba(0,0,0,0) 62%, rgba(0,0,0,.32) 100%),
    repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.16) 2px 3px);
}
.overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;
  background:rgba(4,6,9,.62);text-align:center;padding:20px;
}
.overlay.hidden{display:none;}
.t-cn{
  font-size:clamp(38px,9vw,58px);font-weight:700;color:var(--gold);letter-spacing:.18em;
  text-shadow:3px 3px 0 #4A3407, 6px 6px 0 rgba(0,0,0,.55);
  text-wrap:balance;margin-left:.18em;
}
.t-en{font-size:12px;letter-spacing:.55em;color:var(--phosphor);text-transform:uppercase;margin-left:.55em;}
.t-sub{font-size:15px;color:var(--gold-hi);letter-spacing:.15em;}
.t-hint{font-size:13px;color:var(--ink);letter-spacing:.1em;}
.t-dim{font-size:12px;color:var(--muted);letter-spacing:.08em;line-height:1.9;}
.t-big{font-size:clamp(26px,6vw,40px);font-weight:700;color:var(--gold);letter-spacing:.2em;text-shadow:2px 2px 0 #4A3407;}
.t-alert{color:var(--alert);text-shadow:2px 2px 0 #3D0E0A;}
.blink{animation:blink 1.1s steps(2,jump-none) infinite;}
@keyframes blink{50%{opacity:.15}}
@media (prefers-reduced-motion:reduce){.blink{animation:none}}
.hud{
  width:172px;display:flex;flex-direction:column;gap:16px;
  background:var(--bezel);border:1px solid var(--edge);border-radius:10px;padding:16px 14px;
  font-size:13px;
}
.label{font-size:10px;text-transform:uppercase;letter-spacing:.22em;color:var(--muted);margin-bottom:7px;}
.icons{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;min-height:14px;}
.icon{width:13px;height:13px;position:relative;background:#4E5A64;}
.icon::before{content:"";position:absolute;left:3px;right:3px;top:3px;bottom:2px;background:#9AA6B0;}
.icon::after{content:"";position:absolute;left:5px;top:0;width:3px;height:5px;background:#D7E1E8;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.num{font-size:20px;font-weight:700;color:var(--gold-hi);font-variant-numeric:tabular-nums;}
.num.ph{color:var(--phosphor);}
.btns{display:flex;flex-direction:column;gap:7px;}
button.ctl{
  background:#131A22;border:1px solid var(--edge);color:var(--ink);
  font:inherit;font-size:11px;letter-spacing:.14em;padding:7px 10px;cursor:pointer;border-radius:4px;
}
button.ctl:hover{border-color:var(--gold);color:var(--gold-hi);}
button.ctl:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.help{font-size:11px;color:var(--muted);line-height:2;letter-spacing:.05em;}
.help b{color:var(--ink);font-weight:400;}
.touch{display:none;margin-top:18px;width:min(92vw,560px);justify-content:space-between;align-items:center;user-select:none;-webkit-user-select:none;}
@media (pointer:coarse){.touch{display:flex;}}
.dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:4px;}
.dpad button, .fire{
  background:#1A222C;border:1px solid var(--edge);color:var(--gold-hi);
  font-size:20px;border-radius:8px;touch-action:none;cursor:pointer;
}
.dpad button:active,.fire:active{background:#2A3542;border-color:var(--gold);}
.dpad .blank{visibility:hidden;}
.fire{width:88px;height:88px;border-radius:50%;font-size:15px;letter-spacing:.1em;color:var(--alert);border-color:#3D2320;}
@media (max-width:780px){
  .arcade{flex-direction:column;align-items:center;}
  .hud{width:min(92vw,560px);flex-direction:row;flex-wrap:wrap;align-items:flex-start;gap:20px;}
  .hud section{min-width:120px;}
  .btns{flex-direction:row;flex-wrap:wrap;}
}
</style>

<div class="logo"><span class="cn">坦克大战</span><span class="en">Tank Battle</span></div>

<div class="arcade">
  <div class="bezel">
    <div class="screen">
      <canvas id="game" width="416" height="416"></canvas>
      <div class="scan"></div>
      <div class="overlay" id="overlay"></div>
    </div>

<div class="touch">

    <button class="blank"></button><button data-dir="2">▼</button><button class="blank"></button>
  </div>
  <button class="fire" id="fireBtn">开火</button>
</div>

<script>
'use strict';
/* ============ 常量 ============ */
const TILE=16, N=26, W=416, H=416;
const EMPTY=0, BRICK=1, STEEL=2, WATER=3, TREE=4, EAGLE=5;
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]]; // 上右下左
const SPAWNS=[{x:0,y:0},{x:192,y:0},{x:384,y:0}];
const PLAYER_SPAWN={x:128,y:384};
const POINTS={basic:100,fast:200,power:300,armor:400};
const ESPEED={basic:1.0,fast:1.9,power:1.3,armor:0.9};
const EHP={basic:1,fast:1,power:1,armor:4};

const PAL={
  player:{b:'#E8B93D',d:'#8A6414',l:'#FFE9A8'},
  basic:{b:'#9AA6B0',d:'#4E5A64',l:'#D7E1E8'},
  fast:{b:'#7BC1CC',d:'#39707B',l:'#CDEFF4'},
  power:{b:'#D08770',d:'#7E4433',l:'#F2C4B3'},
  armor:{b:'#8FB07A',d:'#4C6440',l:'#D2E6C3'},
  bonus:{b:'#E0483C',d:'#7E1F17',l:'#FFB3AC'}
};

const MAPS=[
[ // 关卡 A · 经典砖阵
".............",
".#.#.#.#.#.#.",
".#.#.#.#.#.#.",
".#.#.#.#.#.#.",
".#.#.#@#.#.#.",
".............",
"@#...###...#@",
".....#.#.....",
".#.#.#.#.#.#.",
".#.#.#.#.#.#.",
".#.#.....#.#.",
".#.#.#.#.#.#.",
"............."
],
[ // 关卡 B · 大河渡桥
"....%...%....",
".##.%.#.%.##.",
".##...#...##.",
"....##.##....",
"~~~~.....~~~~",
"~~~~.....~~~~",
"....#####....",
".%%..#.#..%%.",
".%%.##.##.%%.",
"..#..#.#..#..",
"..#.......#..",
".....#.#.....",
"............."
],
[ // 关卡 C · 钢铁要塞
".....@.@.....",
".###.....###.",
".#%%.###.%%#.",
".....#.#.....",
".#@#.#.#.#@#.",
".#.........#.",
"..#.#####.#..",
".%%...#...%%.",
".%%.#.#.#.%%.",
"..#.#...#.#..",
"..#..#.#..#..",
".....#.#.....",
"............."
]
];

/* ============ 音效 ============ */
let actx=null, muted=false, noiseBuf=null;
function ac(){
  if(!actx){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null; actx=new AC(); }
  if(actx.state==='suspended') actx.resume();
  return actx;
}
function tone(freq,dur,type,vol,slideTo,delay){
  if(muted) return; const a=ac(); if(!a) return;
  const t0=a.currentTime+(delay||0);
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||'square';
  o.frequency.setValueAtTime(freq,t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),t0+dur);
  g.gain.setValueAtTime(vol||0.06,t0);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t0); o.stop(t0+dur+0.03);
}
function noise(dur,vol,delay){
  if(muted) return; const a=ac(); if(!a) return;
  if(!noiseBuf){
    const len=Math.floor(a.sampleRate*0.6);
    noiseBuf=a.createBuffer(1,len,a.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  }
  const t0=a.currentTime+(delay||0);
  const src=a.createBufferSource(); src.buffer=noiseBuf;
  const f=a.createBiquadFilter(); f.type='lowpass';
  f.frequency.setValueAtTime(1400,t0);
  f.frequency.exponentialRampToValueAtTime(120,t0+dur);
  const g=a.createGain();
  g.gain.setValueAtTime(vol||0.15,t0);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  src.connect(f); f.connect(g); g.connect(a.destination);
  src.start(t0); src.stop(t0+dur+0.03);
}
const sfx={
  shoot(){ tone(900,0.07,'square',0.045,300); },
  clank(){ tone(1500,0.045,'square',0.04,900); },
  brick(){ noise(0.09,0.1); },
  boom(){ noise(0.3,0.2); tone(170,0.28,'triangle',0.13,40); },
  bigboom(){ noise(0.55,0.28); tone(120,0.5,'triangle',0.16,28); },
  power(){ [660,880,1100,1320].forEach((f,i)=>tone(f,0.09,'square',0.05,null,i*0.07)); },
  life(){ [523,659,784,1046,1318].forEach((f,i)=>tone(f,0.08,'square',0.05,null,i*0.06)); },
  start(){ [392,523,659,784].forEach((f,i)=>tone(f,0.13,'square',0.055,null,i*0.11)); },
  clear(){ [784,988,1175,1568].forEach((f,i)=>tone(f,0.12,'square',0.05,null,i*0.1)); },
  over(){ [392,311,262,196].forEach((f,i)=>tone(f,0.22,'triangle',0.07,null,i*0.19)); }
};

/* ============ 状态 ============ */
const cv=document.getElementById('game');
const g=cv.getContext('2d');
g.imageSmoothingEnabled=false;

let grid=new Uint8Array(N*N);
let state='title';       // title | stagestart | playing | stageclear | gameover
let stateTimer=0, paused=false, tick=0;
let stageNum=1, score=0, lives=3, starLevel=0;
let baseAlive=true, gameOverTimer=0, freezeTimer=0;
let enemies=[], bullets=[], explosions=[], powerups=[];
let queue=[], spawnTimer=0, spawnIndex=0, spawnedCount=0, maxOnField=4;

const player={
  isPlayer:true, x:PLAYER_SPAWN.x, y:PLAYER_SPAWN.y, dir:0,
  alive:true, shield:0, deadTimer:0, cooldown:0, liveBullets:0, anim:0, hitFlash:0
};

/* ============ 地图 ============ */
function gi(c,r){ return r*N+c; }
function loadStage(n,quiet){
  stageNum=n;
  grid=new Uint8Array(N*N);
  const map=MAPS[(n-1)%MAPS.length];
  for(let br=0;br<13;br++){
    const row=map[br]||'';
    for(let bc=0;bc<13;bc++){
      const ch=row[bc]||'.';
      let t=EMPTY;
      if(ch==='#')t=BRICK; else if(ch==='@')t=STEEL;
      else if(ch==='~')t=WATER; else if(ch==='%')t=TREE;
      if(t!==EMPTY){
        for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++)
          grid[gi(bc*2+dx,br*2+dy)]=t;
      }
    }
  }
  // 基地要塞
  for(let r=22;r<26;r++)for(let c=10;c<16;c++) grid[gi(c,r)]=EMPTY;
  [[11,23],[12,23],[13,23],[14,23],[11,24],[14,24],[11,25],[14,25]]
    .forEach(([c,r])=>grid[gi(c,r)]=BRICK);
  [[12,24],[13,24],[12,25],[13,25]].forEach(([c,r])=>grid[gi(c,r)]=EAGLE);
  // 清空出生点
  [[0,0],[12,0],[24,0],[8,24]].forEach(([c,r])=>{
    for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++) grid[gi(c+dx,r+dy)]=EMPTY;
  });

  baseAlive=true; gameOverTimer=0; freezeTimer=0;
  enemies=[]; bullets=[]; explosions=[]; powerups=[];
  spawnIndex=0; spawnedCount=0; spawnTimer=40;
  maxOnField=Math.min(6,3+n);
  const nArmor=Math.min(6,n), nPower=Math.min(6,1+Math.floor(n/2)), nFast=Math.min(8,3+n);
  const nBasic=Math.max(0,20-nArmor-nPower-nFast);
  queue=[];
  for(let i=0;i<nBasic;i++)queue.push('basic');
  for(let i=0;i<nFast;i++)queue.push('fast');
  for(let i=0;i<nPower;i++)queue.push('power');
  for(let i=0;i<nArmor;i++)queue.push('armor');
  for(let i=queue.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [queue[i],queue[j]]=[queue[j],queue[i]]; }

  player.x=PLAYER_SPAWN.x; player.y=PLAYER_SPAWN.y; player.dir=0;
  player.alive=true; player.shield=200; player.cooldown=0; player.liveBullets=0;

  setState('stagestart'); stateTimer=100;
  if(!quiet) sfx.start();
  updateHud();
}

/* ============ 碰撞 ============ */
function solidForTank(t){ return t===BRICK||t===STEEL||t===WATER||t===EAGLE; }
function tankBlocked(x,y,self){
  if(x<-0.01||y<-0.01||x+32>W+0.01||y+32>H+0.01) return true;
  const c0=Math.max(0,Math.floor(x/TILE)), r0=Math.max(0,Math.floor(y/TILE));
  const c1=Math.min(N-1,Math.floor((x+31.9)/TILE)), r1=Math.min(N-1,Math.floor((y+31.9)/TILE));
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)
    if(solidForTank(grid[gi(c,r)])) return true;
  const all=(player.alive?[player]:[]).concat(enemies);
  for(const t of all){
    if(t===self||t.spawn>0) continue;
    if(x<t.x+31 && x+31>t.x && y<t.y+31 && y+31>t.y) return true;
  }
  return false;
}
function tryMove(t,dist){
  const [dx,dy]=DIRS[t.dir];
  let total=dist, moved=false;
  while(total>0){
    const step=Math.min(1,total);
    if(!tankBlocked(t.x+dx*step,t.y+dy*step,t)){
      t.x+=dx*step; t.y+=dy*step; total-=step; moved=true;
    }else break;
  }
  if(total>0){ // 拐角吸附：向最近的可通行车道滑移
    if(dx!==0){
      const base=Math.round(t.y/TILE)*TILE;
      for(const cand of [base,base-TILE,base+TILE]){
        if(cand===t.y||cand<0||cand+32>H||Math.abs(cand-t.y)>TILE+0.5) continue;
        if(!tankBlocked(t.x+dx,cand,t)){
          const s=Math.sign(cand-t.y)*Math.min(Math.abs(cand-t.y),dist);
          if(!tankBlocked(t.x,t.y+s,t)){ t.y+=s; moved=true; }
          break;
        }
      }
    }else{
      const base=Math.round(t.x/TILE)*TILE;
      for(const cand of [base,base-TILE,base+TILE]){
        if(cand===t.x||cand<0||cand+32>W||Math.abs(cand-t.x)>TILE+0.5) continue;
        if(!tankBlocked(cand,t.y+dy,t)){
          const s=Math.sign(cand-t.x)*Math.min(Math.abs(cand-t.x),dist);
          if(!tankBlocked(t.x+s,t.y,t)){ t.x+=s; moved=true; }
          break;
        }
      }
    }
  }
  if(moved) t.anim++;
  return moved;
}

/* ============ 子弹 ============ */
function fire(t){
  const [dx,dy]=DIRS[t.dir];
  const speed=t.isPlayer ? (starLevel>=1?6.5:5) : (t.type==='power'?5:3.2);
  bullets.push({
    x:t.x+16+dx*18, y:t.y+16+dy*18, dir:t.dir, speed,
    owner:t, fromPlayer:!!t.isPlayer,
    pierce:!!t.isPlayer&&starLevel>=3, dead:false
  });
  t.liveBullets++;
  if(t.isPlayer) sfx.shoot();
}
function killBullet(b,boomAt){
  if(b.dead) return;
  b.dead=true; b.owner.liveBullets=Math.max(0,b.owner.liveBullets-1);
  if(boomAt) explosions.push({x:b.x,y:b.y,t:0,max:14,big:false});
}
function hitTiles(b){
  const c0=Math.max(0,Math.floor((b.x-3)/TILE)), r0=Math.max(0,Math.floor((b.y-3)/TILE));
  const c1=Math.min(N-1,Math.floor((b.x+2)/TILE)), r1=Math.min(N-1,Math.floor((b.y+2)/TILE));
  let hit=false, eagle=false, steel=false;
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){
    const t=grid[gi(c,r)];
    if(t===BRICK||t===STEEL||t===EAGLE){ hit=true; if(t===EAGLE)eagle=true; if(t===STEEL)steel=true; }
  }
  if(!hit) return false;
  if(eagle && baseAlive){ destroyBase(); return true; }
  const vertical=(b.dir===0||b.dir===2);
  if(vertical){
    const r=(b.dir===0)?r0:r1;
    const cA=Math.floor(b.x/TILE);
    const cB=(b.x-cA*TILE>=8)?cA+1:cA-1;
    let broke=false;
    for(const c of [cA,cB]){
      if(c<0||c>=N) continue;
      const t=grid[gi(c,r)];
      if(t===BRICK){ grid[gi(c,r)]=EMPTY; broke=true; }
      else if(t===STEEL&&b.pierce){ grid[gi(c,r)]=EMPTY; broke=true; }
    }
    if(broke) sfx.brick(); else if(steel) sfx.clank();
  }else{
    const c=(b.dir===3)?c0:c1;
    const rA=Math.floor(b.y/TILE);
    const rB=(b.y-rA*TILE>=8)?rA+1:rA-1;
    let broke=false;
    for(const r of [rA,rB]){
      if(r<0||r>=N) continue;
      const t=grid[gi(c,r)];
      if(t===BRICK){ grid[gi(c,r)]=EMPTY; broke=true; }
      else if(t===STEEL&&b.pierce){ grid[gi(c,r)]=EMPTY; broke=true; }
    }
    if(broke) sfx.brick(); else if(steel) sfx.clank();
  }
  return true;
}
function updateBullet(b){
  const [dx,dy]=DIRS[b.dir];
  let remaining=b.speed;
  while(remaining>0&&!b.dead){
    const step=Math.min(4,remaining);
    b.x+=dx*step; b.y+=dy*step; remaining-=step;
    if(b.x<0||b.y<0||b.x>W||b.y>H){ killBullet(b,true); break; }
    if(hitTiles(b)){ killBullet(b,true); break; }
    for(const o of bullets){
      if(o===b||o.dead||o.fromPlayer===b.fromPlayer) continue;
      if(Math.abs(o.x-b.x)<6&&Math.abs(o.y-b.y)<6){ killBullet(b,false); killBullet(o,false); break; }
    }
    if(b.dead) break;
    if(b.fromPlayer){
      for(const e of enemies){
        if(e.spawn>0) continue;
        if(b.x>e.x&&b.x<e.x+32&&b.y>e.y&&b.y<e.y+32){
          hitEnemy(e); killBullet(b,false); break;
        }
      }
    }else if(player.alive){
      if(b.x>player.x&&b.x<player.x+32&&b.y>player.y&&b.y<player.y+32){
        if(player.shield>0){ sfx.clank(); }
        else killPlayer();
        killBullet(b,true);
      }
    }
  }
}

/* ============ 敌军 ============ */
function trySpawnEnemy(){
  if(queue.length===0) return;
  if(spawnTimer>0){ spawnTimer--; return; }
  if(enemies.length>=maxOnField){ spawnTimer=30; return; }
  const pt=SPAWNS[spawnIndex%3];
  for(const t of enemies.concat(player.alive?[player]:[])){
    if(pt.x<t.x+31&&pt.x+31>t.x&&pt.y<t.y+31&&pt.y+31>t.y){ spawnTimer=25; return; }
  }
  spawnIndex++; spawnedCount++;
  const type=queue.shift();
  enemies.push({
    type, x:pt.x, y:pt.y, dir:2, spawn:60,
    hp:EHP[type], speed:ESPEED[type],
    bonus:(spawnedCount===4||spawnedCount===11||spawnedCount===18),
    dirTimer:0, cool:40, liveBullets:0, anim:0, hitFlash:0
  });
  spawnTimer=Math.max(55,190-stageNum*12);
  updateHud();
}
function chooseDir(e){
  e.dirTimer=40+Math.random()*90;
  const r=Math.random();
  if(r<0.25){ e.dir=Math.floor(Math.random()*4); return; }
  let tx,ty;
  if(r<0.7||!player.alive){ tx=192; ty=384; }
  else { tx=player.x; ty=player.y; }
  const dx=tx-e.x, dy=ty-e.y;
  if(Math.abs(dx)>Math.abs(dy)) e.dir=dx>0?1:3;
  else e.dir=dy>0?2:0;
}
function updateEnemy(e){
  if(e.spawn>0){ e.spawn--; return; }
  if(e.hitFlash>0) e.hitFlash--;
  if(freezeTimer>0) return;
  e.dirTimer--;
  const moved=tryMove(e,e.speed);
  if(!moved||e.dirTimer<=0) chooseDir(e);
  if(e.cool>0) e.cool--;
  if(e.cool<=0&&e.liveBullets<1&&Math.random()<0.02){ fire(e); e.cool=30; }
}
function hitEnemy(e){
  if(e.hp>1){ e.hp--; e.hitFlash=10; sfx.clank(); return; }
  destroyEnemy(e,true);
}
function destroyEnemy(e,drop){
  explosions.push({x:e.x+16,y:e.y+16,t:0,max:26,big:true});
  sfx.boom();
  score+=POINTS[e.type];
  if(drop&&e.bonus) spawnPowerup();
  const i=enemies.indexOf(e);
  if(i>=0) enemies.splice(i,1);
  updateHud();
}

/* ============ 道具 ============ */
const PTYPES=['helmet','star','grenade','clock','life'];
const PGLYPH={helmet:'盾',star:'星',grenade:'雷',clock:'冻',life:'命'};
function spawnPowerup(){
  const type=PTYPES[Math.floor(Math.random()*PTYPES.length)];
  let x=192,y=192;
  for(let i=0;i<60;i++){
    const bc=Math.floor(Math.random()*13), br=Math.floor(Math.random()*12);
    if(bc>=5&&bc<=7&&br>=10) continue; // 避开基地
    let ok=true;
    for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++){
      const t=grid[gi(bc*2+dx,br*2+dy)];
      if(t===STEEL||t===WATER||t===EAGLE||t===BRICK) ok=false;
    }
    if(ok){ x=bc*32; y=br*32; break; }
  }
  powerups=[{type,x,y,life:720}];
  sfx.power();
}
function applyPowerup(p){
  score+=500;
  if(p.type==='helmet') player.shield=600;
  else if(p.type==='star') starLevel=Math.min(3,starLevel+1);
  else if(p.type==='grenade'){
    for(const e of enemies.slice()) destroyEnemy(e,false);
    sfx.bigboom();
  }
  else if(p.type==='clock') freezeTimer=480;
  else if(p.type==='life'){ lives++; sfx.life(); }
  sfx.power();
  updateHud();
}

/* ============ 玩家 ============ */
const dirStack=[];
const keys={fire:false};
function killPlayer(){
  explosions.push({x:player.x+16,y:player.y+16,t:0,max:26,big:true});
  sfx.bigboom();
  player.alive=false; player.deadTimer=80; player.liveBullets=0;
  starLevel=0; lives--;
  if(lives<0&&!gameOverTimer) gameOverTimer=110;
  updateHud();
}
function updatePlayer(){
  if(!player.alive){
    if(lives>=0){
      player.deadTimer--;
      if(player.deadTimer<=0){
        let clear=true;
        for(const e of enemies){
          if(PLAYER_SPAWN.x<e.x+31&&PLAYER_SPAWN.x+31>e.x&&PLAYER_SPAWN.y<e.y+31&&PLAYER_SPAWN.y+31>e.y) clear=false;
        }
        if(clear){
          player.x=PLAYER_SPAWN.x; player.y=PLAYER_SPAWN.y;
          player.dir=0; player.alive=true; player.shield=200;
        }else player.deadTimer=10;
      }
    }
    return;
  }
  if(player.shield>0) player.shield--;
  if(player.cooldown>0) player.cooldown--;
  if(dirStack.length){
    const d=dirStack[dirStack.length-1];
    player.dir=d;
    tryMove(player,1.7);
  }
  const maxB=starLevel>=2?2:1;
  if(keys.fire&&player.cooldown<=0&&player.liveBullets<maxB){
    fire(player); player.cooldown=12;
  }
}

/* ============ 基地 ============ */
function destroyBase(){
  baseAlive=false;
  explosions.push({x:208,y:400,t:0,max:30,big:true});
  sfx.bigboom();
  if(!gameOverTimer) gameOverTimer=140;
}

/* ============ 主循环 ============ */
function gameTick(){
  tick++;
  if(state==='stagestart'){
    stateTimer--;
    if(stateTimer<=0){ setState('playing'); }
    return;
  }
  if(state==='stageclear'){
    stateTimer--;
    if(stateTimer<=0) loadStage(stageNum+1);
    return;
  }
  if(state!=='playing'||paused) return;

  if(freezeTimer>0) freezeTimer--;
  updatePlayer();
  trySpawnEnemy();
  for(const e of enemies) updateEnemy(e);
  for(const b of bullets) if(!b.dead) updateBullet(b);
  bullets=bullets.filter(b=>!b.dead);
  for(const p of powerups.slice()){
    p.life--;
    if(p.life<=0){ powerups=[]; continue; }
    if(player.alive&&player.x<p.x+26&&player.x+32>p.x+6&&player.y<p.y+26&&player.y+32>p.y+6){
      applyPowerup(p); powerups=[];
    }
  }
  for(const ex of explosions.slice()){
    ex.t++;
    if(ex.t>=ex.max) explosions.splice(explosions.indexOf(ex),1);
  }
  if(gameOverTimer>0){
    gameOverTimer--;
    if(gameOverTimer<=0){ setState('gameover'); sfx.over(); }
    return;
  }
  if(baseAlive&&queue.length===0&&enemies.length===0){
    setState('stageclear'); stateTimer=150; score+=1000; sfx.clear(); updateHud();
  }
}

/* ============ 贴图 ============ */
function makeTile(draw){
  const c=document.createElement('canvas'); c.width=TILE; c.height=TILE;
  const x=c.getContext('2d'); draw(x); return c;
}
const brickTile=makeTile(x=>{
  x.fillStyle='#54260F'; x.fillRect(0,0,16,16);
  x.fillStyle='#B14A22';
  x.fillRect(0,0,7,7); x.fillRect(8,0,8,7);
  x.fillRect(0,8,3,7); x.fillRect(4,8,7,7); x.fillRect(12,8,4,7);
  x.fillStyle='#C96437';
  x.fillRect(0,0,7,2); x.fillRect(8,0,8,2);
});
const steelTile=makeTile(x=>{
  x.fillStyle='#39434B'; x.fillRect(0,0,16,16);
  x.fillStyle='#9AA6B0'; x.fillRect(1,1,14,14);
  x.fillStyle='#D7E1E8'; x.fillRect(1,1,14,5);
  x.fillStyle='#4E5A64'; x.fillRect(5,5,6,6);
});
const waterTiles=[0,1].map(f=>makeTile(x=>{
  x.fillStyle='#0F2F6E'; x.fillRect(0,0,16,16);
  x.fillStyle='#3E6FCB';
  for(let r=0;r<2;r++)for(let i=0;i<2;i++)
    x.fillRect(((i*8)+(r%2?4:0)+(f?4:0))%16, 3+r*8, 5, 2);
}));
const treeTile=makeTile(x=>{
  x.fillStyle='#1E5A22'; x.fillRect(0,0,16,16);
  x.fillStyle='#2F8A35';
  for(let i=0;i<14;i++) x.fillRect((i*7)%15,(i*11)%15,3,3);
  x.fillStyle='#5FBF5A';
  for(let i=0;i<8;i++) x.fillRect((i*5+3)%14,(i*13+2)%14,2,2);
});

/* ============ 渲染 ============ */
function drawTank(t,pal){
  const frame=Math.floor(t.anim/3)%2;
  g.save();
  g.translate(t.x+16,t.y+16);
  g.rotate(t.dir*Math.PI/2);
  g.fillStyle=pal.d;
  g.fillRect(-15,-13,7,27); g.fillRect(8,-13,7,27);
  g.fillStyle=pal.l;
  for(let i=-13+frame*2;i<14;i+=4){ g.fillRect(-15,i,7,1); g.fillRect(8,i,7,1); }
  g.fillStyle=pal.b; g.fillRect(-9,-11,18,22);
  g.fillStyle=pal.d; g.fillRect(-9,7,18,4);
  g.fillStyle=pal.l; g.fillRect(-9,-11,18,3);
  g.fillStyle=pal.d; g.fillRect(-5,-5,10,12);
  g.fillStyle=pal.b; g.fillRect(-4,-4,8,10);
  g.fillStyle=pal.l; g.fillRect(-2,-17,4,13);
  g.restore();
  if(t.hitFlash>0&&t.hitFlash%4<2){
    g.globalAlpha=0.45; g.fillStyle='#FFFFFF';
    g.fillRect(t.x,t.y,32,32); g.globalAlpha=1;
  }
}
function drawSpawnStar(x,y){
  const s=(tick%16<8)?5:11;
  const cx=x+16, cy=y+16;
  g.fillStyle='#FFE9A8';
  g.fillRect(cx-s,cy-1,s*2,3); g.fillRect(cx-1,cy-s,3,s*2);
  g.fillStyle='#E8B93D';
  g.fillRect(cx-Math.floor(s*.6),cy-Math.floor(s*.6),2,2);
  g.fillRect(cx+Math.floor(s*.6)-1,cy+Math.floor(s*.6)-1,2,2);
  g.fillRect(cx-Math.floor(s*.6),cy+Math.floor(s*.6)-1,2,2);
  g.fillRect(cx+Math.floor(s*.6)-1,cy-Math.floor(s*.6),2,2);
}
function drawEagle(){
  const x=192,y=384;
  g.fillStyle='#39434B'; g.fillRect(x+3,y+22,26,8);
  g.fillStyle='#4E5A64'; g.fillRect(x+7,y+18,18,5);
  if(baseAlive){
    g.fillStyle='#E8B93D';
    g.fillRect(x+13,y+3,6,6);              // 头
    g.fillRect(x+11,y+8,10,10);            // 身
    g.fillRect(x+3,y+8,8,4); g.fillRect(x+21,y+8,8,4);   // 翅
    g.fillRect(x+5,y+12,6,3); g.fillRect(x+21,y+12,6,3);
    g.fillStyle='#FFE9A8'; g.fillRect(x+13,y+3,6,2);
    g.fillStyle='#7E5B10'; g.fillRect(x+12,y+16,8,3);
  }else{
    g.fillStyle='#5A626B';
    g.fillRect(x+9,y+10,14,9); g.fillRect(x+5,y+14,6,5); g.fillRect(x+21,y+14,6,5);
    g.strokeStyle='#E0483C'; g.lineWidth=3;
    g.beginPath(); g.moveTo(x+7,y+5); g.lineTo(x+25,y+19);
    g.moveTo(x+25,y+5); g.lineTo(x+7,y+19); g.stroke();
  }
}
function render(){
  g.fillStyle='#000'; g.fillRect(0,0,W,H);
  const wf=Math.floor(tick/26)%2;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const t=grid[gi(c,r)];
    if(t===BRICK) g.drawImage(brickTile,c*TILE,r*TILE);
    else if(t===STEEL) g.drawImage(steelTile,c*TILE,r*TILE);
    else if(t===WATER) g.drawImage(waterTiles[wf],c*TILE,r*TILE);
  }
  drawEagle();
  g.fillStyle='#FFE9A8';
  for(const b of bullets){
    g.fillRect(b.x-2,b.y-2,4,4);
  }
  if(player.alive){
    drawTank(player,PAL.player);
    if(player.shield>0){
      g.strokeStyle=(tick%8<4)?'#9FE8FF':'#FFFFFF';
      g.lineWidth=2;
      g.beginPath(); g.arc(player.x+16,player.y+16,19,0,Math.PI*2); g.stroke();
    }
  }
  for(const e of enemies){
    if(e.spawn>0){ drawSpawnStar(e.x,e.y); continue; }
    let pal=PAL[e.type];
    if(e.bonus&&tick%20<10) pal=PAL.bonus;
    drawTank(e,pal);
  }
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)
    if(grid[gi(c,r)]===TREE) g.drawImage(treeTile,c*TILE,r*TILE);
  for(const p of powerups){
    if(p.life<180&&tick%14<7) continue;
    g.fillStyle='#0C1116'; g.fillRect(p.x+3,p.y+3,26,26);
    g.strokeStyle=(tick%12<6)?'#E8B93D':'#FFE9A8'; g.lineWidth=2;
    g.strokeRect(p.x+4,p.y+4,24,24);
    g.fillStyle='#FFFFFF'; g.font='bold 14px ui-monospace,monospace';
    g.textAlign='center'; g.textBaseline='middle';
    g.fillText(PGLYPH[p.type],p.x+16,p.y+17);
  }
  for(const ex of explosions){
    const p=ex.t/ex.max;
    const r1=ex.big?4+p*24:2+p*9;
    g.fillStyle='#D9502A';
    g.beginPath(); g.arc(ex.x,ex.y,r1,0,Math.PI*2); g.fill();
    if(p<0.85){
      g.fillStyle='#F2A33C';
      g.beginPath(); g.arc(ex.x,ex.y,r1*0.65,0,Math.PI*2); g.fill();
      g.fillStyle='#FFF3B0';
      g.beginPath(); g.arc(ex.x,ex.y,r1*0.32,0,Math.PI*2); g.fill();
    }
  }
  if(freezeTimer>0&&tick%30<15){
    g.fillStyle='rgba(140,200,255,0.06)'; g.fillRect(0,0,W,H);
  }
}

/* ============ HUD 与界面 ============ */
const el=id=>document.getElementById(id);
const overlay=el('overlay');
let lastIconCount=-1;
function updateHud(){
  el('lives').textContent=Math.max(0,lives);
  el('stage').textContent=stageNum;
  el('score').textContent=String(score).padStart(6,'0');
  if(queue.length!==lastIconCount){
    lastIconCount=queue.length;
    el('enemyIcons').innerHTML='<i class="icon"></i>'.repeat(queue.length);
  }
}
function setState(s){
  state=s;
  if(s==='playing'){ overlay.classList.add('hidden'); return; }
  overlay.classList.remove('hidden');
  if(s==='title'){
    overlay.innerHTML=
      '<div class="t-cn">坦克大战</div>'+
      '<div class="t-en">Tank Battle</div>'+
      '<div class="t-hint blink">按 回车 / 点击屏幕 开始游戏</div>'+
      '<div class="t-dim">方向键或 WASD 移动 · 空格或 J 射击<br>消灭所有敌军，守住你的基地之鹰</div>';
  }else if(s==='stagestart'){
    overlay.innerHTML='<div class="t-big">第 '+stageNum+' 关</div><div class="t-en">Stage '+stageNum+'</div>';
  }else if(s==='stageclear'){
    overlay.innerHTML='<div class="t-big">关卡完成!</div><div class="t-sub">奖励 +1000</div>';
  }else if(s==='gameover'){
    overlay.innerHTML=
      '<div class="t-big t-alert">游戏结束</div>'+
      '<div class="t-en" style="color:var(--alert)">Game Over</div>'+
      '<div class="t-sub">得分 '+String(score).padStart(6,'0')+' · 到达第 '+stageNum+' 关</div>'+
      '<div class="t-hint blink">按 回车 / 点击屏幕 再来一局</div>';
  }else if(s==='paused'){
    overlay.innerHTML='<div class="t-big">已暂停</div><div class="t-hint">按 P 继续</div>';
  }
}
function togglePause(force){
  if(state!=='playing'&&!(paused&&state==='paused')) {
    if(!(state==='paused')) { /* 仅游戏中可暂停 */ }
  }
  if(state==='playing'&&!paused){
    if(force===false) return;
    paused=true; setState('paused'); state='playing';
    el('btnPause').textContent='继续 P';
  }else if(paused){
    if(force===true) return;
    paused=false; overlay.classList.add('hidden');
    el('btnPause').textContent='暂停 P';
  }
}
function startGame(){
  score=0; lives=3; starLevel=0; paused=false;
  el('btnPause').textContent='暂停 P';
  loadStage(1);
}

/* ============ 输入 ============ */
const DIRKEYS={ArrowUp:0,KeyW:0,ArrowRight:1,KeyD:1,ArrowDown:2,KeyS:2,ArrowLeft:3,KeyA:3};
function pressDir(d){
  const i=dirStack.indexOf(d);
  if(i>=0) dirStack.splice(i,1);
  dirStack.push(d);
}
function releaseDir(d){
  const i=dirStack.indexOf(d);
  if(i>=0) dirStack.splice(i,1);
}
addEventListener('keydown',e=>{
  if(e.repeat){ if(e.code in DIRKEYS||e.code==='Space') e.preventDefault(); return; }
  ac();
  if(e.code in DIRKEYS){ e.preventDefault(); pressDir(DIRKEYS[e.code]); }
  else if(e.code==='Space'||e.code==='KeyJ'){ e.preventDefault(); keys.fire=true; }
  else if(e.code==='Enter'){
    if(state==='title'||state==='gameover') startGame();
  }
  else if(e.code==='KeyP'){ togglePause(); }
  else if(e.code==='KeyM'){ toggleSound(); }
});
addEventListener('keyup',e=>{
  if(e.code in DIRKEYS) releaseDir(DIRKEYS[e.code]);
  else if(e.code==='Space'||e.code==='KeyJ') keys.fire=false;
});
cv.parentElement.addEventListener('pointerdown',()=>{
  ac();
  if(state==='title'||state==='gameover') startGame();
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&state==='playing'&&!paused) togglePause();
});
el('btnPause').addEventListener('click',()=>{ ac(); togglePause(); });
el('btnRestart').addEventListener('click',()=>{ ac(); startGame(); });
function toggleSound(){
  muted=!muted;
  el('btnSound').textContent=muted?'声音:关 M':'声音:开 M';
}
el('btnSound').addEventListener('click',toggleSound);

document.querySelectorAll('.dpad button[data-dir]').forEach(btn=>{
  const d=+btn.dataset.dir;
  const down=e=>{ e.preventDefault(); ac(); pressDir(d); };
  const up=e=>{ e.preventDefault(); releaseDir(d); };
  btn.addEventListener('pointerdown',down);
  btn.addEventListener('pointerup',up);
  btn.addEventListener('pointercancel',up);
  btn.addEventListener('pointerleave',up);
});
const fb=el('fireBtn');
fb.addEventListener('pointerdown',e=>{ e.preventDefault(); ac(); keys.fire=true;
  if(state==='title'||state==='gameover') startGame(); });
fb.addEventListener('pointerup',e=>{ e.preventDefault(); keys.fire=false; });
fb.addEventListener('pointercancel',()=>{ keys.fire=false; });

/* ============ 启动 ============ */
loadStage(1,true);
setState('title');
let last=0,acc=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!last) last=ts;
  let d=ts-last; last=ts;
  if(d>100) d=100;
  acc+=d;
  while(acc>=1000/60){ gameTick(); acc-=1000/60; }
  render();
}
requestAnimationFrame(frame);
</script>
